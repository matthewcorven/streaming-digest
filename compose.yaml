services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    environment:
      POSTGRES_DB: streamingdigest
      POSTGRES_USER: streamingdigest
      POSTGRES_PASSWORD: streamingdigest
    ports:
      - "5432:5432"
    networks:
      - streaming-digest-internal
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/StreamingDigest.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__streamingdigest: Host=postgres;Port=5432;Database=streamingdigest;Username=streamingdigest;Password=streamingdigest
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      STREAMINGDIGEST_OBSERVABILITY_ENABLED: ${STREAMINGDIGEST_OBSERVABILITY_ENABLED:-true}
      observability__services__grafana__url: http://grafana:3000
      observability__services__prometheus__url: http://prometheus:9090
      observability__services__loki__url: http://loki:3100
      observability__services__tempo__url: http://tempo:3200
      observability__services__otelCollector__url: http://otel-collector:4317
    depends_on:
      - postgres
      - otel-collector
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - streaming-digest-internal

  scraper:
    build:
      context: ./src/StreamingDigest.Scraper
    environment:
      PORT: 3000
    networks:
      - streaming-digest-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./compose/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - streaming-digest-internal

  prometheus:
    image: prom/prometheus:v2.54.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./compose/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    networks:
      - streaming-digest-internal

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./compose/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./compose/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - streaming-digest-internal

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./compose/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3101:3100"
    networks:
      - streaming-digest-internal

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./compose/observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3201:3200"
    networks:
      - streaming-digest-internal

volumes:
  postgres-data:

networks:
  streaming-digest-internal:
    internal: true
