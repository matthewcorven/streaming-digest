name: "streaming-digest"
services:
  postgres:
    image: "docker.io/pgvector/pgvector:0.8.5-pg18-trixie"
    container_name: "streaming-digest-postgres"
    pull_policy: "if_not_present"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "${POSTGRES_USERNAME}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "streamingdigest-postgres18-data"
        read_only: false
    networks:
      - "aspire"
  ollama:
    image: "docker.io/ollama/ollama:latest"
    container_name: "streaming-digest-ollama"
    pull_policy: "if_not_present"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - type: "volume"
        target: "/root/.ollama"
        source: "streamingdigest-ollama-data"
        read_only: false
    networks:
      - "aspire"
  ollama-bootstrap:
    image: "docker.io/ollama/ollama:latest"
    container_name: "streaming-digest-ollama-bootstrap"
    pull_policy: "if_not_present"
    command:
      - "-c"
      - "ollama serve & ollama_pid=$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull bge-m3; ollama pull llama3.1:8b; kill $$ollama_pid; wait $$ollama_pid"
    entrypoint:
      - "/bin/sh"
    volumes:
      - type: "volume"
        target: "/root/.ollama"
        source: "streamingdigest-ollama-data"
        read_only: false
    depends_on:
      ollama:
        condition: "service_started"
    networks:
      - "aspire"
  whisper:
    image: "${WHISPER_IMAGE:-ghcr.io/matthewcorven/streaming-digest-whisper:latest}"
    container_name: "streaming-digest-whisper"
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    networks:
      - "aspire"
  otel-collector:
    image: "docker.io/otel/opentelemetry-collector-contrib:0.114.0"
    container_name: "streaming-digest-otel-collector"
    pull_policy: "if_not_present"
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    ports:
      - "4317:4317"
      - "4318:4318"
    expose:
      - "4318"
    volumes:
      - type: "bind"
        target: "/etc/otelcol-contrib/config.yaml"
        source: "${OTEL_COLLECTOR_BINDMOUNT_0}"
        read_only: true
    networks:
      - "aspire"
  prometheus:
    image: "docker.io/prom/prometheus:v2.54.0"
    container_name: "streaming-digest-prometheus"
    pull_policy: "if_not_present"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "127.0.0.1:9090:9090"
    expose:
      - "9090"
    volumes:
      - type: "volume"
        target: "/prometheus"
        source: "streamingdigest-prometheus-data"
        read_only: false
      - type: "bind"
        target: "/etc/prometheus/prometheus.yml"
        source: "${PROMETHEUS_BINDMOUNT_0}"
        read_only: true
    networks:
      - "aspire"
  grafana:
    image: "docker.io/grafana/grafana:11.4.0"
    container_name: "streaming-digest-grafana"
    pull_policy: "if_not_present"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    volumes:
      - type: "volume"
        target: "/var/lib/grafana"
        source: "streamingdigest-grafana-data"
        read_only: false
      - type: "bind"
        target: "/etc/grafana/provisioning"
        source: "${GRAFANA_BINDMOUNT_0}"
        read_only: true
      - type: "bind"
        target: "/var/lib/grafana/dashboards"
        source: "${GRAFANA_BINDMOUNT_1}"
        read_only: true
    depends_on:
      prometheus:
        condition: "service_started"
    networks:
      - "aspire"
  pgadmin:
    image: "docker.io/dpage/pgadmin4:9.6.0"
    container_name: "streaming-digest-pgadmin"
    pull_policy: "if_not_present"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
      PGADMIN_LISTEN_PORT: "5050"
    ports:
      - "127.0.0.1:5050:5050"
    expose:
      - "5050"
    volumes:
      - type: "volume"
        target: "/var/lib/pgadmin"
        source: "streamingdigest-pgadmin-data"
        read_only: false
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  loki:
    image: "docker.io/grafana/loki:3.2.0"
    container_name: "streaming-digest-loki"
    pull_policy: "if_not_present"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    ports:
      - "127.0.0.1:3100:3100"
    expose:
      - "3100"
    volumes:
      - type: "volume"
        target: "/loki"
        source: "streamingdigest-loki-data"
        read_only: false
      - type: "bind"
        target: "/etc/loki/local-config.yaml"
        source: "${LOKI_BINDMOUNT_0}"
        read_only: true
    networks:
      - "aspire"
  tempo:
    image: "docker.io/grafana/tempo:2.6.0"
    container_name: "streaming-digest-tempo"
    pull_policy: "if_not_present"
    command:
      - "-config.file=/etc/tempo.yaml"
    ports:
      - "127.0.0.1:3200:3200"
    expose:
      - "3200"
    volumes:
      - type: "volume"
        target: "/var/tempo"
        source: "streamingdigest-tempo-data"
        read_only: false
      - type: "bind"
        target: "/etc/tempo.yaml"
        source: "${TEMPO_BINDMOUNT_0}"
        read_only: true
    networks:
      - "aspire"
  scraper:
    image: "${SCRAPER_IMAGE:-ghcr.io/matthewcorven/streaming-digest-scraper:latest}"
    container_name: "streaming-digest-scraper"
    build:
      context: "./src/StreamingDigest.Scraper"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
    expose:
      - "3000"
    volumes:
      - type: "volume"
        target: "/var/lib/streaming-digest/media"
        source: "streaming-digest-media"
        read_only: false
      - type: "volume"
        target: "/var/lib/streaming-digest/raw-html"
        source: "streaming-digest-debug-html"
        read_only: false
    networks:
      - "aspire"
  api:
    image: "${API_IMAGE:-ghcr.io/matthewcorven/streaming-digest-api:latest}"
    container_name: "streaming-digest-api"
    build:
      context: "."
      dockerfile: "src/StreamingDigest.Api/Dockerfile"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ConnectionStrings__streamingdigest: "Host=postgres;Port=5432;Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD};Database=streamingdigest"
      STREAMINGDIGEST_HOST: "postgres"
      STREAMINGDIGEST_PORT: "5432"
      STREAMINGDIGEST_USERNAME: "${POSTGRES_USERNAME}"
      STREAMINGDIGEST_PASSWORD: "${POSTGRES_PASSWORD}"
      STREAMINGDIGEST_URI: "postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/streamingdigest"
      STREAMINGDIGEST_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/streamingdigest"
      STREAMINGDIGEST_DATABASENAME: "streamingdigest"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      STREAMINGDIGEST_OBSERVABILITY_ENABLED: "true"
      STREAMINGDIGEST_EMBEDDING_MODEL: "bge-m3"
      STREAMINGDIGEST_LLM_MODEL: "llama3.1:8b"
      Scraper__BaseUrl: "http://scraper:3000"
      llm__baseUrl: "http://ollama:11434"
      STREAMINGDIGEST_WHISPER_BASE_URL: "http://whisper:8080"
      observability:services:grafana:url: "http://grafana:3000"
      observability:services:pgadmin:url: "http://pgadmin:5050"
      observability:services:prometheus:url: "http://prometheus:9090"
      observability:services:loki:url: "http://loki:3100"
      observability:services:tempo:url: "http://tempo:3200"
      observability:services:otelCollector:url: "http://otel-collector:4317"
      ASPNETCORE_ENVIRONMENT: "Production"
      notifications__matrix__enabled: "${NOTIFICATIONS_MATRIX_ENABLED:-false}"
      notifications__matrix__homeserverUrl: "${NOTIFICATIONS_MATRIX_HOMESERVER_URL:-https://matrix-client.matrix.org}"
      notifications__matrix__accessToken: "${NOTIFICATIONS_MATRIX_ACCESS_TOKEN:-}"
      notifications__matrix__roomId: "${NOTIFICATIONS_MATRIX_ROOM_ID:-}"
      notifications__matrix__botUserId: "${NOTIFICATIONS_MATRIX_BOT_USER_ID:-}"
      notifications__matrix__dashboardBaseUrl: "${NOTIFICATIONS_MATRIX_DASHBOARD_BASE_URL:-http://localhost:8080}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: "service_started"
      scraper:
        condition: "service_started"
      ollama:
        condition: "service_started"
      ollama-bootstrap:
        condition: "service_completed_successfully"
      otel-collector:
        condition: "service_started"
      pgadmin:
        condition: "service_started"
    networks:
      - "aspire"
  worker:
    image: "${WORKER_IMAGE:-ghcr.io/matthewcorven/streaming-digest-worker:latest}"
    container_name: "streaming-digest-worker"
    build:
      context: "."
      dockerfile: "src/StreamingDigest.Worker/Dockerfile"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__streamingdigest: "Host=postgres;Port=5432;Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD};Database=streamingdigest"
      STREAMINGDIGEST_HOST: "postgres"
      STREAMINGDIGEST_PORT: "5432"
      STREAMINGDIGEST_USERNAME: "${POSTGRES_USERNAME}"
      STREAMINGDIGEST_PASSWORD: "${POSTGRES_PASSWORD}"
      STREAMINGDIGEST_URI: "postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/streamingdigest"
      STREAMINGDIGEST_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/streamingdigest"
      STREAMINGDIGEST_DATABASENAME: "streamingdigest"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      STREAMINGDIGEST_OBSERVABILITY_ENABLED: "true"
      STREAMINGDIGEST_EMBEDDING_MODEL: "bge-m3"
      STREAMINGDIGEST_LLM_MODEL: "llama3.1:8b"
      Scraper__BaseUrl: "http://scraper:3000"
      llm__baseUrl: "http://ollama:11434"
      STREAMINGDIGEST_WHISPER_BASE_URL: "http://whisper:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      notifications__matrix__enabled: "${NOTIFICATIONS_MATRIX_ENABLED:-false}"
      notifications__matrix__homeserverUrl: "${NOTIFICATIONS_MATRIX_HOMESERVER_URL:-https://matrix-client.matrix.org}"
      notifications__matrix__accessToken: "${NOTIFICATIONS_MATRIX_ACCESS_TOKEN:-}"
      notifications__matrix__roomId: "${NOTIFICATIONS_MATRIX_ROOM_ID:-}"
      notifications__matrix__botUserId: "${NOTIFICATIONS_MATRIX_BOT_USER_ID:-}"
      notifications__matrix__dashboardBaseUrl: "${NOTIFICATIONS_MATRIX_DASHBOARD_BASE_URL:-http://localhost:8080}"
    volumes:
      - type: "volume"
        target: "/var/lib/streaming-digest/media"
        source: "streaming-digest-media"
        read_only: false
      - type: "volume"
        target: "/var/lib/streaming-digest/raw-html"
        source: "streaming-digest-debug-html"
        read_only: false
      - type: "volume"
        target: "/var/lib/streaming-digest/matrix"
        source: "streaming-digest-matrix-state"
        read_only: false
    depends_on:
      postgres:
        condition: "service_started"
      scraper:
        condition: "service_started"
      ollama:
        condition: "service_started"
      ollama-bootstrap:
        condition: "service_completed_successfully"
      otel-collector:
        condition: "service_started"
    networks:
      - "aspire"
  web:
    image: "${WEB_IMAGE:-ghcr.io/matthewcorven/streaming-digest-web:latest}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${WEB_PORT:-8081}"
    ports:
      - "${WEB_PORT:-8081}"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  streamingdigest-postgres18-data:
    driver: "local"
  streamingdigest-ollama-data:
    driver: "local"
  streamingdigest-prometheus-data:
    driver: "local"
  streamingdigest-grafana-data:
    driver: "local"
  streamingdigest-pgadmin-data:
    driver: "local"
  streamingdigest-loki-data:
    driver: "local"
  streamingdigest-tempo-data:
    driver: "local"
  streaming-digest-media:
    driver: "local"
    external: false
  streaming-digest-debug-html:
    driver: "local"
    external: false
  streaming-digest-matrix-state:
    driver: "local"
    external: false
