name: Squad CI
# Project type was not detected — configure build/test commands below

on:
  pull_request:
    branches: [dev, preview, main, insider]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, insider]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Docker is available
        run: docker version

      - name: Build and test
        run: |
          dotnet test StreamingDigest.slnx --filter "Category!=Integration&Category!=E2E" --logger "console;verbosity=minimal"

      - name: First-run smoke
        env:
          STREAMINGDIGEST_E2E_SMOKE: "1"
        run: |
          dotnet test tests/StreamingDigest.E2E/StreamingDigest.E2E.csproj --filter "FullyQualifiedName~Zero_user_start_requires_setup_then_blocks_setup_after_first_sign_in" --logger "console;verbosity=minimal"
